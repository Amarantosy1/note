# Projet information
site_name: amarantosy的外置大脑
site_url: https://amarantosy.com
site_author: amarantosy
site_description: amarantosy的外置大脑

# repo
repo_name: amarantosy1/notebook
repo_url: https://github.com/Amarantosy1/empirical-paper-workflow

# copyright
copyright: Copyright &copy; 2026 amarantosy


# configuration
theme:
  name: material
  custom_dir: overrides
  language: zh


  features:
    - navigation.indexes
    - navigation.top
    - navigation.tabs
    - navigation.expand
    - navigation.footer
    - content.code.copy
    - search.highlight
    - toc.follow

  palette:
    - scheme: default
      toggle:
        icon: material/white-balance-sunny
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

      

plugins:
  - search
  - meta



# extentions
markdown_extensions: 
  - admonition
  - def_list
  - footnotes
  - md_in_html
  - meta
  - pymdownx.caret
  - pymdownx.betterem
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format:
            !!python/name:pymdownx.superfences.fence_code_format 
  - pymdownx.arithmatex: 
      generic: true
  - toc:
      toc_depth: 1-6
      permalink: true 
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      auto_title: true 
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - zensical_hardbreak
  - zensical_obsidian:
      docs_dir: docs
      base_url: /
      strict: false

zensical_nav:
  recursive: true
  include_index: true

nav:
  - Home:
    - index.md
  - Computer Science:
    - cs/index.md
    - missing-semester: cs/missing-semester.md
  - Reading:
    - reading/index.md
    - auto: reading

  
# extra部分
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Amarantosy1
    - icon: fontawesome/regular/envelope
      link: mailto:<amarantosy@icloud.com>

# 主题配置
extra_css:
  - css/dark_modified.css
  - css/font_modified.css
  - css/obsidian_wiki.css


